<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#FAFAF9"/>

  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1A202C">HireMe — Multi-Agent Pipeline Architecture</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#718096">Minimal free-tier AWS footprint + external Gemini reasoning engine</text>

  <!-- Candidate / Recruiter actors -->
  <rect x="30" y="90" width="180" height="50" rx="8" fill="#EBF8FF" stroke="#3182CE" stroke-width="1.5"/>
  <text x="120" y="120" text-anchor="middle" font-size="13" fill="#2C5282">Candidate uploads resume</text>

  <rect x="790" y="90" width="180" height="50" rx="8" fill="#EBF8FF" stroke="#3182CE" stroke-width="1.5"/>
  <text x="880" y="120" text-anchor="middle" font-size="13" fill="#2C5282">Recruiter dashboard</text>

  <!-- S3 -->
  <rect x="30" y="180" width="180" height="70" rx="8" fill="#FFF5EB" stroke="#DD6B20" stroke-width="1.5"/>
  <text x="120" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#9C4221">Amazon S3</text>
  <text x="120" y="223" text-anchor="middle" font-size="11" fill="#9C4221">resumes / JDs</text>
  <text x="120" y="238" text-anchor="middle" font-size="11" fill="#9C4221">static frontend host</text>

  <!-- DynamoDB -->
  <rect x="790" y="180" width="180" height="70" rx="8" fill="#F0FFF4" stroke="#38A169" stroke-width="1.5"/>
  <text x="880" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#276749">Amazon DynamoDB</text>
  <text x="880" y="221" text-anchor="middle" font-size="11" fill="#276749">candidates · applications</text>
  <text x="880" y="236" text-anchor="middle" font-size="11" fill="#276749">scores · recommendations</text>

  <!-- Lambda pipeline container -->
  <rect x="250" y="290" width="500" height="380" rx="10" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="500" y="313" text-anchor="middle" font-size="13" font-weight="700" fill="#4A5568">AWS Lambda — agent functions</text>

  <!-- Resume Agent -->
  <rect x="300" y="330" width="400" height="46" rx="8" fill="#EDF2F7" stroke="#4A5568" stroke-width="1.2"/>
  <text x="500" y="358" text-anchor="middle" font-size="13" fill="#1A202C">Resume Agent — structured skills/experience JSON</text>

  <!-- Matching Agent -->
  <rect x="300" y="392" width="400" height="46" rx="8" fill="#EDF2F7" stroke="#4A5568" stroke-width="1.2"/>
  <text x="500" y="420" text-anchor="middle" font-size="13" fill="#1A202C">Matching Agent — match score % + gap list</text>

  <!-- Branch label -->
  <text x="500" y="454" text-anchor="middle" font-size="11" font-style="italic" fill="#A0AEC0">below threshold → "not advanced", pipeline stops</text>

  <!-- Interview Agent -->
  <rect x="300" y="468" width="400" height="46" rx="8" fill="#EDF2F7" stroke="#4A5568" stroke-width="1.2"/>
  <text x="500" y="496" text-anchor="middle" font-size="13" fill="#1A202C">Interview Agent — tailored Qs + answer scores</text>

  <!-- Headhunter Agent -->
  <rect x="300" y="530" width="400" height="46" rx="8" fill="#EDF2F7" stroke="#4A5568" stroke-width="1.2"/>
  <text x="500" y="558" text-anchor="middle" font-size="13" fill="#1A202C">Headhunter Agent — outreach message draft</text>

  <!-- Orchestrator -->
  <rect x="300" y="600" width="400" height="52" rx="8" fill="#FAF5FF" stroke="#805AD5" stroke-width="1.5"/>
  <text x="500" y="622" text-anchor="middle" font-size="13" font-weight="700" fill="#553C9A">Orchestrator</text>
  <text x="500" y="639" text-anchor="middle" font-size="11" fill="#553C9A">sequences agents, branches on score, aggregates final recommendation</text>

  <!-- Gemini external -->
  <rect x="790" y="480" width="180" height="70" rx="8" fill="#FFFAF0" stroke="#D69E2E" stroke-width="1.5"/>
  <text x="880" y="503" text-anchor="middle" font-size="13" font-weight="700" fill="#975A16">Google Gemini API</text>
  <text x="880" y="521" text-anchor="middle" font-size="11" fill="#975A16">external, non-AWS</text>
  <text x="880" y="536" text-anchor="middle" font-size="11" fill="#975A16">shared reasoning engine</text>

  <!-- Arrows -->
  <line x1="120" y1="140" x2="120" y2="178" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="210" y1="215" x2="300" y2="353" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="500" y1="376" x2="500" y2="390" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="438" x2="500" y2="466" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="514" x2="500" y2="528" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="576" x2="500" y2="598" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="700" y1="625" x2="880" y2="252" stroke="#38A169" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="880" y1="178" x2="880" y2="142" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="700" y1="500" x2="788" y2="500" stroke="#D69E2E" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="500" y="690" text-anchor="middle" font-size="11" fill="#A0AEC0">Auth: lightweight token check / existing third-party integration · Logging: default Lambda/CloudWatch logs · No managed API/notification layer</text>
</svg>
